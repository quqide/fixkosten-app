# Stack für Dockge. Den Pfad unter "volumes" an deinen Pool anpassen.
services:
  fixkosten:
    image: ghcr.io/quqide/fixkosten-app:latest
    container_name: fixkosten
    restart: unless-stopped
    ports:
      - "3080:3000"
    environment:
      TZ: Europe/Berlin
      # Später mit Authentik: Person aus dem Login übernehmen statt sie auszuwählen
      # AUTH_HEADER: X-authentik-username
      # PERSON_A_USER: stephan
      # PERSON_B_USER: partnerin
    volumes:
      - /mnt/POOL/apps/fixkosten:/data
